name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }}, Java ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # the minimum supported version
        java: ['17']
        include:
          # the latest LTS version
          - os: ubuntu-latest
            java: '25'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and test
        run: ./gradlew build
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}-java-${{ matrix.java }}
          path: '*/build/reports/tests/'

  native:
    name: native (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v5
      - name: Build CLI jar
        run: ./gradlew :asciidoctorj-cli:assemble
      - name: Build native image
        shell: bash
        run: tools/build-native.sh
      - name: Smoke test
        shell: bash
        run: tools/native-smoke-test/run.sh asciidoctorj-cli/build/native/asciidoctorj asciidoctorj-cli/build/libs/asciidoctorj-cli-*[0-9T].jar
      - name: Upload native executable
        uses: actions/upload-artifact@v7
        with:
          name: asciidoctorj-${{ matrix.platform }}
          path: asciidoctorj-cli/build/native/asciidoctorj${{ runner.os == 'Windows' && '.exe' || '' }}
