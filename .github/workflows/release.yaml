name: Release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Version to release, e.g. 3.0.2'
        required: true
      nextVersion:
        description: 'Next development version, e.g. 3.0.3-SNAPSHOT (defaults to the next patch version)'
        required: false

concurrency: release

env:
  ORG_GRADLE_PROJECT_signingKeyId: ${{ secrets.GPG_KEY_ID }}
  ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_PRIVATE_KEY }}
  ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
  ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.OSS_SONATYPE_USERNAME }}
  ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.OSS_SONATYPE_PASSWORD }}
  RELEASE_VERSION: ${{ inputs.releaseVersion }}
  NEXT_VERSION: ${{ inputs.nextVersion }}

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '11'
      - name: Check the versions
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || [[ "$RELEASE_VERSION" == *-SNAPSHOT ]]; then
            echo "::error::Invalid release version: $RELEASE_VERSION"
            exit 1
          fi
          if [ -z "$NEXT_VERSION" ]; then
            IFS=. read -r major minor patch <<< "${RELEASE_VERSION%%-*}"
            if [[ "$RELEASE_VERSION" == *-* ]]; then
              NEXT_VERSION="$major.$minor.$patch-SNAPSHOT"
            else
              NEXT_VERSION="$major.$minor.$((patch + 1))-SNAPSHOT"
            fi
            echo "NEXT_VERSION=$NEXT_VERSION" >> "$GITHUB_ENV"
          fi
          if [[ "$NEXT_VERSION" != *-SNAPSHOT ]]; then
            echo "::error::The next version must end with -SNAPSHOT: $NEXT_VERSION"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$RELEASE_VERSION" > /dev/null; then
            echo "::error::The tag v$RELEASE_VERSION already exists"
            exit 1
          fi
          if ! grep -q '^== Unreleased$' CHANGELOG.adoc; then
            echo "::error::CHANGELOG.adoc has no '== Unreleased' section"
            exit 1
          fi
          echo "Releasing $RELEASE_VERSION, next version $NEXT_VERSION"
      - name: Prepare the release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo "PREVIOUS_TAG=$(git describe --tags --abbrev=0)" >> "$GITHUB_ENV"
          sed -i "s/^version=.*/version=$RELEASE_VERSION/" gradle.properties
          sed -i "s/^== Unreleased$/== $RELEASE_VERSION ($(date -u +%F))/" CHANGELOG.adoc
          git commit -am "Release v$RELEASE_VERSION"
          git tag "v$RELEASE_VERSION"
      - name: Build
        run: |
          unset GEM_PATH GEM_HOME JRUBY_OPTS
          ./gradlew --no-daemon clean build
      - name: Prepare the next development iteration
        run: |
          sed -i "s/^version=.*/version=$NEXT_VERSION/" gradle.properties
          sed -i "0,/^== /s/^== /== Unreleased\n\n&/" CHANGELOG.adoc
          git commit -am "Prepare next development iteration $NEXT_VERSION"
      # push before publishing, so that a release that cannot be tagged on main is never published
      - name: Push the commits and the tag
        run: git push --atomic origin HEAD:main "refs/tags/v$RELEASE_VERSION"
      - name: Publish to Maven Central
        run: |
          git checkout "v$RELEASE_VERSION"
          unset GEM_PATH GEM_HOME JRUBY_OPTS
          ./gradlew --no-daemon publishToSonatype closeAndReleaseSonatypeStagingRepository
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ruby ci/release-notes.rb "$RELEASE_VERSION" > "$RUNNER_TEMP/release-notes.md"
          printf '\n\n**Full Changelog**: %s/%s/compare/%s...v%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$PREVIOUS_TAG" "$RELEASE_VERSION" >> "$RUNNER_TEMP/release-notes.md"
          prerelease=$([[ "$RELEASE_VERSION" == *-* ]] && echo --prerelease || true)
          gh release create "v$RELEASE_VERSION" --title "v$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" $prerelease
      - name: Wait for the distribution on Maven Central
        run: |
          url="https://repo1.maven.org/maven2/org/asciidoctor/asciidoctorj/$RELEASE_VERSION/asciidoctorj-$RELEASE_VERSION-bin.zip"
          for _ in $(seq 120); do
            curl -sfI -o /dev/null "$url" && exit 0
            sleep 30
          done
          echo "::error::$url is still not available"
          exit 1
      - name: Publish to SDKMAN
        env:
          ORG_GRADLE_PROJECT_sdkman_consumer_key: ${{ secrets.SDKMAN_CONSUMER_KEY }}
          ORG_GRADLE_PROJECT_sdkman_consumer_token: ${{ secrets.SDKMAN_CONSUMER_TOKEN }}
        run: |
          unset GEM_PATH GEM_HOME JRUBY_OPTS
          # a pre-release is not made the default version
          task=$([[ "$RELEASE_VERSION" == *-* ]] && echo sdkMinorRelease || echo sdkMajorRelease)
          ./gradlew --no-daemon ":asciidoctorj-distribution:$task"
