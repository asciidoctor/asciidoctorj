name: Build Main
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    name: Build
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        java:
          - '21'
        distribution:
          - 'temurin'
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
      - name: Build
        run: |
          ./gradlew -S -Pskip.signing assemble
          unset GEM_PATH GEM_HOME JRUBY_OPTS
          ./gradlew -S -Pskip.signing check
  build-windows:
    name: Build on Windows
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        java:
          - '21'
        distribution:
          - 'temurin'
        os:
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
      - name: Assemble
        shell: cmd
        run: |
          gradlew.bat -i assemble
      - name: Check
        shell: cmd
        run: |
          gradlew.bat -i -S check
      - name: Upload asciidoctorj-core reports
        uses: actions/upload-artifact@v7
        env:
          os_name: ${{ matrix.os }}
          java_version: ${{ matrix.java }}
        if: always()
        with:
          name: asciidoctorj-core-reports-${{ env.os_name }}-${{ env.java_version }}
          path: asciidoctorj-core/build/reports/*
      - name: Upload asciidoctorj-documentation reports
        uses: actions/upload-artifact@v7
        if: always()
        env:
          os_name: ${{ matrix.os }}
          java_version: ${{ matrix.java }}
        with:
          name: asciidoctorj-documentation-reports-${{ env.os_name }}-${{ env.java_version }}
          path: asciidoctorj-documentation/build/reports/*
  test-asciidoctor-upstream:
    name: Test Asciidoctor Upstream
    needs:
      - build
      - build-windows
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        java:
          - '21'
        os:
          - ubuntu-latest
        maven:
          - '3.9.4'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Setup Java
        uses: s4u/setup-maven-action@v1.22.0
        with:
          java-distribution: temurin
          java-version: ${{ matrix.java }}
          maven-version: ${{ matrix.maven }}
      - name: Upstream Build
        run: |
          unset GEM_PATH GEM_HOME JRUBY_OPTS
          ./ci/test-asciidoctor-upstream.sh
      - name: Upload asciidoctorj-core reports
        uses: actions/upload-artifact@v7
        if: always()
        env:
          os_name: ${{ matrix.os }}
          java_version: ${{ matrix.java }}
        with:
          name: asciidoctorj-core-reports-upstream-${{ env.os_name }}-${{ env.java_version }}
          path: asciidoctorj-core/build/reports/*
  test-java-17:
    name: Test Java implementation on Java 17
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # the build requires Java 21, the tests run on Java 17 (the minimum version supported by the Java implementation)
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v6
      - name: Test
        run: >-
          ./gradlew -PtestJavaVersion=17 -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64
          :asciidoctorj-java:test :asciidoctorj-java-cli:test
          :asciidoctorj-java-documentation:test
  build-native:
    name: Build native executable (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Gradle 8.12 doesn't run on Java 25: build the CLI jar with Java 21, then the native image with GraalVM 25
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build CLI jar
        run: ./gradlew :asciidoctorj-java-cli:assemble
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build native image
        shell: bash
        run: tools/build-native.sh
      - name: Smoke test
        shell: bash
        run: tools/native-smoke-test/run.sh asciidoctorj-java-cli/build/native/asciidoctorj asciidoctorj-java-cli/build/libs/asciidoctorj-java-cli-*[0-9T].jar
      - name: Upload native executable
        uses: actions/upload-artifact@v7
        with:
          name: asciidoctorj-java-${{ matrix.platform }}
          path: asciidoctorj-java-cli/build/native/asciidoctorj${{ runner.os == 'Windows' && '.exe' || '' }}
