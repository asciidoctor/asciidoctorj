// The artifacts of the JRuby implementation were renamed in 4.0 (e.g. org.asciidoctor:asciidoctorj -> org.asciidoctor:asciidoctorj-jruby).
// Set project.ext.relocatedFrom to the former artifactId, then apply this script after gradle/publish.gradle.
//
// Publish a relocation POM under the former artifactId, so that the builds that depend on it get this artifact (Maven and Gradle follow the relocation).
// NOTE: this artifact can't also declare the former artifactId as a capability, because Gradle would then reject the relocation:
// the relocation module provides the same capability (its implicit one).

def formerArtifactId = project.ext.relocatedFrom

publishing.publications.create('mavenRelocation', MavenPublication) {
  artifactId = formerArtifactId
  pom {
    name = formerArtifactId
    description = "Relocated to ${project.group}:${project.name}"
    packaging = 'pom'
    distributionManagement {
      relocation {
        artifactId = project.name
        message = "${project.group}:${formerArtifactId} is now ${project.group}:${project.name}, the JRuby implementation of AsciidoctorJ."
      }
    }
  }
}
