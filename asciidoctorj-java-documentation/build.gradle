description = 'The tests that back the code snippets of the documentation'

dependencies {
    testImplementation project(':asciidoctorj-java')
    testImplementation project(':asciidoctorj-test-support')
    testImplementation libs.assertj
    testImplementation libs.jsoup
    testImplementation libs.commons.io
}

// the examples that only rely on the AsciidoctorJ API are shared between the implementations
sourceSets {
    test {
        java.srcDir rootProject.file('asciidoctorj-documentation-common/src/test/java')
        resources.srcDir rootProject.file('asciidoctorj-documentation-common/src/test/resources')
    }
}
