description = 'The tests that back the code snippets of the documentation'

dependencies {
    testImplementation project(':asciidoctorj-java')
    testImplementation project(':asciidoctorj-test-support')
    testImplementation libs.assertj
    testImplementation libs.jsoup
    testImplementation libs.commons.io
}

sourceSets {
    test {
        java {
            // PrismJsHighlighter relies on Nashorn, which is not available since Java 15 (like in AsciidoctorJ)
            exclude '**/PrismJsHighlighter*.java'
        }
    }
}
