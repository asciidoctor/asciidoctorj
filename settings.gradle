rootProject.name = 'asciidoctorj'

// the JRuby implementation (Asciidoctor running on JRuby), published as org.asciidoctor:asciidoctorj-jruby
include \
  'asciidoctorj-jruby',
  'asciidoctorj-arquillian-extension',
  'asciidoctorj-api',
  'asciidoctorj-jruby-cli',
  'asciidoctorj-jruby-distribution',
  'asciidoctorj-jruby-documentation',
  'asciidoctorj-wildfly-integration-test',
  'asciidoctorj-test-support',
  'asciidoctorj-springboot-integration-test',
  'asciidoctorj-springboot-integration-test:springboot-app'

// the Java implementation (a pure Java port of Asciidoctor), published as org.asciidoctor:asciidoctorj-java
include \
  'asciidoctorj-java',
  'asciidoctorj-java-cli',
  'asciidoctorj-java-documentation'
