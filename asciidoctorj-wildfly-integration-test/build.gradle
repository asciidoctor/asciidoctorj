jar.enabled = false

ext {
    wildflyVersion = '42.0.0.Final'
    wildflyArquillianVersion = '5.1.0.Final'
    jakartaServletVersion = '6.1.0'
}

configurations {
    jbossmodule
    jbossdist { transitive = false }
}

dependencies {

    // AsciidoctorJ and its runtime dependencies (asciidoctorj-api, JRuby...) are installed as a WildFly module
    jbossmodule project(':asciidoctorj')

    jbossdist "org.wildfly:wildfly-dist:$wildflyVersion@zip"

    testCompileOnly project(':asciidoctorj')
    testImplementation "jakarta.servlet:jakarta.servlet-api:$jakartaServletVersion"
    testImplementation "org.jsoup:jsoup:$jsoupVersion"
    testImplementation "org.jboss.arquillian.junit5:arquillian-junit5-container:$arquillianVersion"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testRuntimeOnly "org.wildfly.arquillian:wildfly-arquillian-container-managed:$wildflyArquillianVersion"
}

def wildflyDist = layout.buildDirectory.dir('wildfly')
def wildflyHome = wildflyDist.map { it.dir("wildfly-$wildflyVersion") }
def moduleDir = layout.buildDirectory.dir('modules/org/asciidoctor/asciidoctorj/main')

def unpackWildfly = tasks.register('unpackWildfly', Copy) {
    from { zipTree(configurations.jbossdist.singleFile) }
    into wildflyDist
    doNotTrackState 'Build on Github Actions seems to fail on Windows without it'
}

def createModuleDescriptor = tasks.register('createModuleDescriptor', Copy) {
    def moduleJars = configurations.jbossmodule.incoming.artifacts.resolvedArtifacts.map { artifacts ->
        artifacts.collect { it.file.name }.sort()
    }
    inputs.property('moduleJars', moduleJars)
    from 'src/test/resources/module.xml'
    into moduleDir
    filter {
        it.replace('@@resources@@', moduleJars.get().collect { "    <resource-root path=\"$it\"/>" }.join('\n'))
    }
}

def createModule = tasks.register('createModule', Copy) {
    from configurations.jbossmodule
    into moduleDir
    dependsOn createModuleDescriptor
}

tasks.named('test') {
    dependsOn unpackWildfly, createModule

    // run WildFly with the same Java version as the tests (the Java toolchain)
    def wildflyJavaHome = javaLauncher.map { it.metadata.installationPath.asFile.absolutePath }
    def jbossHome = wildflyHome.get().asFile.absolutePath
    def modulePath = jbossHome + '/modules' + File.pathSeparator + layout.buildDirectory.dir('modules').get().asFile.absolutePath

    systemProperty 'jboss.home', jbossHome
    systemProperty 'module.path', modulePath
    doFirst {
        systemProperty 'wildfly.java.home', wildflyJavaHome.get()
    }
}
