plugins {
    alias(libs.plugins.spring.boot)
}

description = 'Checks that AsciidoctorJ works in a Spring Boot executable jar (nested jars)'

dependencies {
    implementation platform(libs.spring.boot.dependencies)
    implementation project(':asciidoctorj-native')
    implementation 'org.springframework.boot:spring-boot-starter'
}

// run the executable jar (i.e., test against the executable jar, not the classes)
test {
    def bootJarFile = tasks.named('bootJar').flatMap { it.archiveFile }
    inputs.file bootJarFile
    doFirst {
        systemProperty 'app.jar', bootJarFile.get().asFile.absolutePath
    }
}
